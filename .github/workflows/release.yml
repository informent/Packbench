name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Run release component checks
        shell: pwsh
        run: ./tests/Test-Release.ps1
      - name: Build engine regressions
        run: dotnet run --project tests/Packbench.EngineTests.csproj -c Release --nologo
      - name: Publish self-contained executable
        run: dotnet publish Packbench.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o release-output --nologo
      - name: Exercise packaged application workflow
        shell: powershell
        run: ./tests/PackageUi.ps1 -Exe "${{ github.workspace }}/release-output/Packbench.exe"
      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          $zip = Join-Path $PWD 'Packbench-win-x64.zip'
          Compress-Archive -Path @('release-output/Packbench.exe', 'README.md', 'LICENSE') -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Packbench-win-x64.zip" | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" Packbench-win-x64.zip SHA256SUMS.txt --title "Packbench $env:GITHUB_REF_NAME" --generate-notes
