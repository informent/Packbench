name: Packbench CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build application
        run: dotnet build Packbench.csproj -c Release
      - name: Run engine regression tests
        run: dotnet run --project tests/Packbench.EngineTests.csproj -c Release
      - name: Publish self-contained build
        run: dotnet publish Packbench.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o ci-output
      - name: Verify published executable
        shell: pwsh
        run: |
          if (-not (Test-Path ci-output/Packbench.exe)) { throw 'Published executable missing.' }
          Get-FileHash ci-output/Packbench.exe -Algorithm SHA256
      - name: Verify packaged application workflow
        shell: powershell
        run: ./tests/PackageUi.ps1 -Exe "${{ github.workspace }}/ci-output/Packbench.exe"
      - name: Verify unattended workflow
        shell: pwsh
        run: |
          ./tests/Test-Headless.ps1 -Exe (Join-Path $PWD 'ci-output/Packbench.exe')
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Packbench-win-x64
          path: ci-output/
